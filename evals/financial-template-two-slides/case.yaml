schema_version: "1.1"
name: financial-template-two-slides
expected_outcome: |
  A template request: the person wants exactly two content slides, no cover or closing,
  with placeholders. Format is clear (slides) and no figures are expected, so the run
  builds without asking. Slide 1 is the financial summary page (KPI tiles, drivers,
  guidance, outlook) and slide 2 the financial comparison table with periods and a delta
  column, numbers right-aligned, built with the kit's kpi_tiles and fin_table. No metric
  is repeated in full between the two slides. Placeholders show the format in brackets,
  the reply lists which metrics are suggestions, and the checker was run.
